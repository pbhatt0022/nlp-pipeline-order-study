<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#b9b5ac;stroke-width:1}
      .gold{fill:#f4f1ea;stroke:#c9a452;stroke-width:1;stroke-dasharray:4 3}
      .a{fill:#fbefe9;stroke:#d97757}
      .b{fill:#eaf1f4;stroke:#4a7a8c}
      .t{fill:#1a1917;font-weight:600}
      .s{fill:#6b6b66;font-size:11px}
      .l{stroke:#6b6b66;stroke-width:1.2;fill:none;marker-end:url(#ar)}
      .lg{stroke:#c9a452;stroke-width:1;fill:none;stroke-dasharray:4 3;marker-end:url(#ar)}
    </style>
  </defs>
  <rect width="960" height="470" fill="#fbfaf7"/>
  <text x="20" y="28" class="t" font-size="15">System overview: offline indexing (top) and online searching (bottom)</text>

  <!-- offline row -->
  <rect x="20" y="50" width="120" height="58" class="box"/><text x="80" y="74" text-anchor="middle" class="t">Corpus</text><text x="80" y="92" text-anchor="middle" class="s">53 Wikipedia articles</text>
  <rect x="165" y="50" width="120" height="58" class="box"/><text x="225" y="74" text-anchor="middle" class="t">Cleaning</text><text x="225" y="92" text-anchor="middle" class="s">Unicode, artefacts</text>
  <rect x="310" y="50" width="130" height="58" class="box"/><text x="375" y="74" text-anchor="middle" class="t">Tokenizer</text><text x="375" y="92" text-anchor="middle" class="s">hybrid + lexicon merge</text>
  <rect x="470" y="40" width="190" height="36" class="a"/><text x="565" y="63" text-anchor="middle" class="t">A: POS → lemma → stop(10)</text>
  <rect x="470" y="84" width="190" height="36" class="b"/><text x="565" y="107" text-anchor="middle" class="t">B: lower → stop(NLTK) → stem</text>
  <rect x="690" y="50" width="130" height="58" class="box"/><text x="755" y="74" text-anchor="middle" class="t">Indexer</text><text x="755" y="92" text-anchor="middle" class="s">positional inverted index</text>
  <path d="M140,79 L163,79" class="l"/><path d="M285,79 L308,79" class="l"/>
  <path d="M440,79 L455,79 L455,58 L468,58" class="l"/><path d="M455,79 L455,102 L468,102" class="l"/>
  <path d="M660,58 L675,58 L675,79 L688,79" class="l"/><path d="M660,102 L675,102 L675,79" class="l"/>
  <rect x="850" y="50" width="95" height="58" class="box"/><text x="897" y="74" text-anchor="middle" class="t">Index</text><text x="897" y="92" text-anchor="middle" class="s">term → doc → pos</text>
  <path d="M820,79 L848,79" class="l"/>

  <!-- side analyses -->
  <rect x="310" y="150" width="350" height="44" class="box"/><text x="485" y="170" text-anchor="middle" class="t">Analysis components (not used for matching)</text><text x="485" y="186" text-anchor="middle" class="s">NER · n-grams · BPE · stemmer and lemmatizer comparison</text>
  <path d="M375,108 L375,148" class="l"/>

  <!-- online row -->
  <rect x="20" y="250" width="120" height="58" class="box"/><text x="80" y="274" text-anchor="middle" class="t">Query</text><text x="80" y="292" text-anchor="middle" class="s">"Tomb Raider" AND …</text>
  <rect x="165" y="250" width="135" height="58" class="box"/><text x="232" y="274" text-anchor="middle" class="t">Query parser</text><text x="232" y="292" text-anchor="middle" class="s">AND / OR / NOT / "…"</text>
  <rect x="325" y="250" width="150" height="58" class="box"/><text x="400" y="274" text-anchor="middle" class="t">Same pipeline</text><text x="400" y="292" text-anchor="middle" class="s">query terms = index terms</text>
  <rect x="500" y="250" width="160" height="58" class="box"/><text x="580" y="274" text-anchor="middle" class="t">Boolean searcher</text><text x="580" y="292" text-anchor="middle" class="s">set algebra + positions</text>
  <rect x="690" y="250" width="130" height="58" class="box"/><text x="755" y="274" text-anchor="middle" class="t">Ranker</text><text x="755" y="292" text-anchor="middle" class="s">TF-IDF, title boost</text>
  <rect x="850" y="250" width="95" height="58" class="box"/><text x="897" y="274" text-anchor="middle" class="t">Results</text><text x="897" y="292" text-anchor="middle" class="s">ranked docs</text>
  <path d="M140,279 L163,279" class="l"/><path d="M300,279 L323,279" class="l"/><path d="M475,279 L498,279" class="l"/><path d="M660,279 L688,279" class="l"/><path d="M820,279 L848,279" class="l"/>
  <path d="M897,108 L897,135 L580,135 L580,248" class="l"/><text x="745" y="130" class="s">postings looked up</text>

  <!-- evaluation -->
  <rect x="500" y="355" width="320" height="58" class="box"/><text x="660" y="379" text-anchor="middle" class="t">Evaluation</text><text x="660" y="397" text-anchor="middle" class="s">P · R · F1 · P@K · R@K · confusion matrix · timing</text>
  <path d="M897,308 L897,384 L822,384" class="l"/>
  <rect x="20" y="355" width="430" height="58" class="gold"/><text x="235" y="379" text-anchor="middle" class="t">Gold standards</text><text x="235" y="397" text-anchor="middle" class="s">relevance (12 × 53) · POS (226 tokens) · NER (51 entities) · lexicon (128 names)</text>
  <path d="M450,384 L498,384" class="lg"/>
  <text x="20" y="452" class="s">GUI: every box above can be inspected live: Pipeline Trace (stages), Index Explorer (index), Search and Compare (searcher, ranker, evaluation).</text>
</svg>
